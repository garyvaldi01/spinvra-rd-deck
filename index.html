  <script src="vendor/hyperframes-player.global.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #06070b; overscroll-behavior: none; }
    hyperframes-slideshow {
      display: block; position: fixed; inset: 0; background: #06070b;
      /* Safe areas iPhone (notch / home indicator) */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #stage {
      position: absolute; left: 50%; top: 50%;
      width: 1920px; height: 1080px;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center center;
    }
    hyperframes-player { position: absolute; inset: 0; width: 1920px; height: 1080px; }

    /* Rotate hint — only on narrow portrait screens (phones held upright) */
    #rotate-hint {
      position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: none;
      align-items: center; gap: 10px;
      background: rgba(13, 17, 25, 0.92);
      border: 1px solid rgba(240, 178, 62, 0.38);
      color: #f4f5f7;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      font-size: 14px; font-weight: 600; letter-spacing: 0.02em;
      padding: 10px 18px; border-radius: 999px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
      pointer-events: none;
    }
    #rotate-hint .ico { font-size: 17px; }
    @media (orientation: portrait) and (max-width: 860px) {
      #rotate-hint { display: inline-flex; }
    }
  </style>
</head>

  <script>
    // Fit the fixed 1920x1080 stage to the viewport (letterboxed).
    // Uses visualViewport when available so iOS Safari's collapsible
    // address bar never crops or leaves gaps.
    (function () {
      var stage = document.getElementById("stage");
      function fit() {
        var w = window.innerWidth, h = window.innerHeight;
        if (window.visualViewport) {
          w = Math.max(w, window.visualViewport.width);
          h = Math.max(h, window.visualViewport.height);
        }
        var s = Math.min(w / 1920, h / 1080);
        stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
      }
      window.addEventListener("resize", fit);
      window.addEventListener("orientationchange", function () { setTimeout(fit, 250); });
      if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
      fit();
      // Keep keyboard focus on the slideshow element so arrow keys work (desktop).
      var sl = document.querySelector("hyperframes-slideshow");
      window.addEventListener("pointerdown", function () { if (sl) sl.focus(); });
    })();
  </script>
