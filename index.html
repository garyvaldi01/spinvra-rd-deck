  <script>
    // Fit the fixed 1920x1080 stage to the viewport (letterboxed).
    (function () {
      var stage = document.getElementById("stage");
      function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
      }
      window.addEventListener("resize", fit);
      fit();
      // Keep keyboard focus on the slideshow element so arrow keys work.
      var sl = document.querySelector("hyperframes-slideshow");
      window.addEventListener("pointerdown", function () { if (sl) sl.focus(); });
    })();
  </script>
