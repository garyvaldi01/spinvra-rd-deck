<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#06070b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Spinvra RD — Propuesta de Adquisición y Crecimiento</title>
  <script src="vendor/hyperframes-player.global.js"></script>
  <script src="vendor/hyperframes-slideshow.global.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #06070b;
      overscroll-behavior: none; touch-action: manipulation;
      -webkit-user-select: none; user-select: none;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }
    hyperframes-slideshow {
      display: block; position: fixed; inset: 0; background: #06070b;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #stage {
      position: absolute; left: 50%; top: 50%;
      width: 1920px; height: 1080px;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center center;
    }
    hyperframes-player { position: absolute; inset: 0; width: 1920px; height: 1080px; }

    /* ══ Puerta de entrada guiada (móvil) ══ */
    #gate {
      display: none;
      position: fixed; inset: 0; z-index: 2000;
      background:
        radial-gradient(900px 600px at 80% -10%, rgba(240, 178, 62, 0.12), transparent 60%),
        #06070b;
      align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      text-align: center;
    }
    #gate .g-inner { max-width: 560px; }
    /* Teléfono animado (solo estado vertical) */
    #gate .g-phone {
      width: 58px; height: 96px; margin: 0 auto 30px;
      border: 3px solid #f0b23e; border-radius: 14px;
      position: relative;
      animation: g-rot 1.8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
    }
    #gate .g-phone::after {
      content: ""; position: absolute; bottom: 6px; left: 50%;
      transform: translateX(-50%);
      width: 16px; height: 3px; border-radius: 2px; background: #f0b23e;
    }
    @keyframes g-rot {
      0%, 22%   { transform: rotate(0deg); }
      60%, 100% { transform: rotate(-90deg); }
    }
    #gate h1 {
      color: #f4f5f7; font-size: 30px; font-weight: 800; letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    #gate p {
      color: #9aa3b5; font-size: 17px; line-height: 1.5; margin-bottom: 28px;
    }
    .g-lang {
      background: rgba(255,255,255,0.04); color: #9aa3b5;
      border: 1px solid rgba(255,255,255,0.14); border-radius: 999px;
      font-family: inherit; font-size: 14px; font-weight: 700;
      padding: 9px 18px; cursor: pointer;
    }
    .g-lang.active { background: rgba(240,178,62,0.16); color: #f0b23e; border-color: rgba(240,178,62,0.5); }
    .g-lang:active { transform: scale(0.96); }
    #gate .g-hint {
      color: rgba(240, 178, 62, 0.85); font-size: 13px; font-weight: 700;
      letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 16px;
    }
    #g-expand {
      display: none;
      width: 100%; max-width: 340px;
      background: linear-gradient(180deg, #ffdf9e, #f0b23e);
      color: #161206; border: 0; border-radius: 999px;
      font-family: inherit; font-size: 19px; font-weight: 800; letter-spacing: 0.06em;
      padding: 18px 24px; cursor: pointer;
      box-shadow: 0 12px 40px rgba(240, 178, 62, 0.30);
      margin-bottom: 18px;
    }
    #g-expand:active { transform: scale(0.97); }
    #g-skip {
      display: none;
      color: #7d8593; font-size: 15px; font-weight: 600;
      text-decoration: underline; text-underline-offset: 4px; cursor: pointer;
    }
    /* Estado vertical: mensaje de girar */
    #gate.portrait .g-phone { display: block; }
    #gate.portrait #g-expand, #gate.portrait #g-skip { display: none; }
    /* Estado horizontal: botón ampliar */
    #gate.landscape .g-phone { display: none; }
    #gate.landscape #g-expand { display: block; }
    #gate.landscape #g-skip { display: inline-block; }
    /* Escritorio: nunca se muestra */
    #gate.desktop { display: none !important; }

    /* ══ Aviso "toca la pantalla" ══ */
    #tap-hint {
      position: fixed; left: 50%;
      bottom: calc(88px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(12px);
      z-index: 1500;
      background: rgba(13, 17, 25, 0.94);
      border: 1px solid rgba(240, 178, 62, 0.45);
      color: #f4f5f7; font-size: 15px; font-weight: 700; letter-spacing: 0.03em;
      padding: 12px 22px; border-radius: 999px;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.55);
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      white-space: nowrap;
    }
    #tap-hint.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ══ Selector de idioma siempre disponible ══ */
    #lang-fab {
      position: fixed; top: calc(14px + env(safe-area-inset-top)); right: calc(14px + env(safe-area-inset-right));
      z-index: 1600;
      display: flex; align-items: center; gap: 7px;
      background: rgba(13, 17, 25, 0.88); color: #c8cfdb;
      border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 999px;
      font-family: inherit; font-size: 13px; font-weight: 800; letter-spacing: 0.08em;
      padding: 8px 14px; cursor: pointer;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    #lang-fab .globe { font-size: 15px; }
    #lang-fab:active { transform: scale(0.95); }
    #lang-menu {
      position: fixed; top: calc(54px + env(safe-area-inset-top)); right: calc(14px + env(safe-area-inset-right));
      z-index: 1601; display: none;
      background: rgba(13, 17, 25, 0.97); border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 16px; padding: 6px; min-width: 150px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
    }
    #lang-menu.open { display: block; }
    #lang-menu button {
      display: block; width: 100%; text-align: left;
      background: transparent; color: #c8cfdb; border: 0; border-radius: 10px;
      font-family: inherit; font-size: 14px; font-weight: 600;
      padding: 11px 14px; cursor: pointer;
    }
    #lang-menu button.active { background: rgba(240, 178, 62, 0.16); color: #f0b23e; font-weight: 800; }
    #lang-menu button:active { background: rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body>
  <hyperframes-slideshow tabindex="0">
    <div id="stage">
      <hyperframes-player src="composition/index.html"></hyperframes-player>
    </div>

    <!-- Duplicated island — keep in sync with composition/index.html -->
    <script type="application/hyperframes-slideshow+json">
    {
      "slides": [
        { "sceneId": "cover", "notes": "Apertura: propuesta de adquisición y crecimiento para Spinvra en República Dominicana. Enfatizar que es una capa adicional, no un reemplazo." },
        { "sceneId": "resumen", "notes": "Resumen ejecutivo: activo de ~10,700 contactos + método Probar-Medir-Optimizar-Escalar + piloto de 300-500. Cerrar con los cinco motores.", "fragments": [7.4] },
        { "sceneId": "experiencia", "notes": "Experiencia previa en el sector de casinos. Presentar como trayectoria, no como portafolio ni alianzas vigentes." },
        { "sceneId": "activo", "notes": "Transición: la experiencia se convierte en el activo de 10,700 contactos y en la oportunidad para Spinvra." },
        { "sceneId": "numero", "notes": "Diapositiva de impacto: 10,700 contactos potenciales. Pausa dramática. Es el activo inicial, no un límite." },
        { "sceneId": "oportunidad", "notes": "Complementar, no competir: Spinvra ya genera visibilidad; esta propuesta añade conversión medible local." },
        { "sceneId": "objetivo", "notes": "Pregunta central: cómo convertir ~10,700 contactos en un canal medible, optimizable y escalable.", "fragments": [41.4] },
        { "sceneId": "metodologia", "notes": "Ciclo continuo: Probar, Medir, Optimizar, Escalar. La base se trata como activo estratégico; nunca se contacta todo de una vez." },
        { "sceneId": "piloto", "notes": "Fase 1: piloto de 300-500 contactos. Qué probamos y qué medimos. Aclarar que son fases de alcance, no resultados garantizados.", "fragments": [55.5, 56.0] },
        { "sceneId": "captacion", "notes": "Segmentación según datos autorizados + tres conceptos comparativos: Promoción, Comunidad, Experiencia.", "fragments": [62.4, 62.9, 63.4] },
        { "sceneId": "funnel", "notes": "Funnel conceptual: audiencia, contacto, registro, primer depósito, comunidad, referido. Cada etapa se mide.", "fragments": [70.4, 70.9, 71.4] },
        { "sceneId": "comunidad", "notes": "Spinvra Community: WhatsApp y Telegram como canal de valor continuo, no un grupo de enlaces.", "fragments": [78.4] },
        { "sceneId": "promociones", "notes": "Códigos diarios US$1-US$77, dinámicas para generar recurrencia y niveles de campaña hasta Big Week como acelerador futuro.", "fragments": [85.4, 85.9] },
        { "sceneId": "remarketing", "notes": "Cuatro estados del usuario con estrategias distintas, frecuencia controlada.", "fragments": [93.4, 93.9, 94.4] },
        { "sceneId": "referidos", "notes": "Programa de referidos de 3 niveles como segundo motor. Ejemplo ilustrativo sobre primer depósito de US$10.", "fragments": [101.4, 101.9] },
        { "sceneId": "equipo", "notes": "Capacidad de ejecución local: dirección, diseño, contenido, community y data. Transmite organización, no arrogancia." },
        { "sceneId": "metricas", "notes": "Dashboard de métricas. Sin resultados inventados: placeholders ilustrativos que se llenan con datos reales.", "fragments": [116.4, 116.9] },
        { "sceneId": "plan", "notes": "Plan de 30 días semana a semana y horizonte 30-90 días.", "fragments": [124.4, 124.9] },
        { "sceneId": "escalamiento", "notes": "Etapas de escala progresiva: 300-500, 1,000-1,500, 2,500-3,500 y nuevos segmentos. Cada etapa se abre según resultados.", "fragments": [132.4, 132.9, 133.4] },
        { "sceneId": "activaciones", "notes": "Segunda etapa: activaciones y promociones cruzadas medibles. Modelo de tres partes y funnel de medición." },
        { "sceneId": "puntacana", "notes": "Punta Cana como ventaja operativa adicional. Primero validar el modelo digital; después explorar la capa física." },
        { "sceneId": "cierre", "notes": "Cierre: 10,700 es el punto de partida. Construir un sistema de crecimiento. Probar, medir, optimizar, escalar." }
      ],
      "slideSequences": []
    }
    </script>

    <!-- Selector de idioma (dentro del slideshow para verse también en pantalla completa) -->
    <button id="lang-fab" type="button" aria-label="Language"><span class="globe">🌐</span><span id="lang-fab-code">ES</span></button>
    <div id="lang-menu">
      <button data-lang="es" type="button">Español</button>
      <button data-lang="en" type="button">English</button>
      <button data-lang="pt" type="button">Português</button>
    </div>
  </hyperframes-slideshow>

  <!-- Puerta de entrada guiada -->
  <div id="gate">
    <div class="g-inner">
      <div class="g-phone"></div>
      <div class="g-hint">Spinvra RD</div>
      <div id="g-langs" style="display:flex; gap:8px; justify-content:center; margin-bottom:22px;">
        <button class="g-lang" data-lang="es" type="button">Español</button>
        <button class="g-lang" data-lang="en" type="button">English</button>
        <button class="g-lang" data-lang="pt" type="button">Português</button>
      </div>
      <h1 id="g-title">Gira tu teléfono</h1>
      <p id="g-sub">Coloca el teléfono en horizontal<br>para ver la presentación</p>
      <button id="g-expand" type="button">⛶&nbsp;&nbsp;<span id="g-expand-t">AMPLIAR PANTALLA</span></button>
      <a id="g-skip">Continuar sin ampliar</a>
    </div>
  </div>

  <div id="tap-hint">👆 Toca la pantalla para avanzar</div>    <script>
    // ══ Multilenguaje ══
    var I18N = {
      es: {
        rotate: "Gira tu teléfono",
        rotateSub: "Coloca el teléfono en horizontal<br>para ver la presentación",
        ready: "¿Listo para presentar?",
        readySub: "Amplía a pantalla completa<br>para una mejor experiencia",
        expand: "AMPLIAR PANTALLA",
        skip: "Continuar sin ampliar",
        tap: "👆 Toca la pantalla para avanzar"
      },
      en: {
        rotate: "Rotate your phone",
        rotateSub: "Turn your phone sideways<br>to view the presentation",
        ready: "Ready to present?",
        readySub: "Go fullscreen<br>for the best experience",
        expand: "FULLSCREEN",
        skip: "Continue without fullscreen",
        tap: "👆 Tap the screen to advance"
      },
      pt: {
        rotate: "Vire o telefone",
        rotateSub: "Coloque o telefone na horizontal<br>para ver a apresentação",
        ready: "Pronto para apresentar?",
        readySub: "Amplie para tela cheia<br>para uma melhor experiência",
        expand: "TELA CHEIA",
        skip: "Continuar sem tela cheia",
        tap: "👆 Toque na tela para avançar"
      }
    };
    var userLang = "es";
    try { userLang = localStorage.getItem("hf-lang") || (navigator.language || "es").slice(0, 2).toLowerCase(); } catch (e) { userLang = (navigator.language || "es").slice(0, 2).toLowerCase(); }
    if (!I18N[userLang]) userLang = "es";

    function pushLangToDeck(l) {
      var player = document.querySelector("hyperframes-player");
      var win = null;
      try { win = (player && player.contentWindow) || null; } catch (err) {}
      if (!win && player) { try { var f = player.querySelector("iframe") || player.shadowRoot && player.shadowRoot.querySelector("iframe"); win = f && f.contentWindow; } catch (err) {} }
      if (win) { try { win.postMessage({ type: "hf-lang", lang: l }, "*"); } catch (err) {} }
    }

    function applyLang(l) {
      userLang = l;
      var t = I18N[l];
      document.getElementById("g-expand-t").textContent = t.expand;
      document.getElementById("g-skip").textContent = t.skip;
      document.getElementById("tap-hint").textContent = t.tap;
      var btns = document.querySelectorAll(".g-lang");
      for (var i = 0; i < btns.length; i++) {
        btns[i].className = "g-lang" + (btns[i].getAttribute("data-lang") === l ? " active" : "");
      }
      var mBtns = document.querySelectorAll("#lang-menu button");
      for (var j = 0; j < mBtns.length; j++) {
        mBtns[j].className = mBtns[j].getAttribute("data-lang") === l ? "active" : "";
      }
      document.getElementById("lang-fab-code").textContent = l.toUpperCase();
      try { localStorage.setItem("hf-lang", l); } catch (e) {}
      pushLangToDeck(l);
      refreshGate();
    }
    var langBtns = document.querySelectorAll(".g-lang, #lang-menu button");
    for (var li = 0; li < langBtns.length; li++) {
      langBtns[li].addEventListener("click", function (e) {
        e.stopPropagation();
        applyLang(this.getAttribute("data-lang"));
        document.getElementById("lang-menu").classList.remove("open");
      });
    }
    document.getElementById("lang-fab").addEventListener("click", function (e) {
      e.stopPropagation();
      document.getElementById("lang-menu").classList.toggle("open");
    });
    document.addEventListener("click", function (e) {
      var menu = document.getElementById("lang-menu");
      if (menu.classList.contains("open") && !menu.contains(e.target) && e.target.id !== "lang-fab") {
        menu.classList.remove("open");
      }
    });

    (function () {
      var sl = document.querySelector("hyperframes-slideshow");
      var gate = document.getElementById("gate");
      var gTitle = document.getElementById("g-title");
      var gSub = document.getElementById("g-sub");
      var tapHint = document.getElementById("tap-hint");

      // Touch / móvil detection: trackpads report pointer:coarse? No — phones/tablets do.
      var isTouch =
        (window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches) ||
        ("ontouchstart" in window) ||
        (navigator.maxTouchPoints > 0 && window.matchMedia("(pointer: coarse)").matches);

      function inPortrait() {
        return window.innerHeight > window.innerWidth;
      }

      var gateUp = false;

      function refreshGate() {
        var t = I18N[userLang];
        if (inPortrait()) {
          gate.className = "portrait";
          gTitle.textContent = t.rotate;
          gSub.innerHTML = t.rotateSub;
        } else {
          gate.className = "landscape";
          gTitle.textContent = t.ready;
          gSub.innerHTML = t.readySub;
        }
      }

      function showGate() {
        if (!isTouch) { gate.className = "desktop"; return; }
        gateUp = true;
        refreshGate();
        gate.style.display = "flex";
      }

      function hideGate() {
        gateUp = false;
        gate.style.display = "none";
        flashTapHint();
      }

      var hintTimer = null;
      function flashTapHint() {
        if (!isTouch) return;
        tapHint.textContent = I18N[userLang].tap;
        tapHint.classList.add("show");
        if (hintTimer) clearTimeout(hintTimer);
        hintTimer = setTimeout(function () { tapHint.classList.remove("show"); }, 3500);
      }

      document.getElementById("g-expand").addEventListener("click", function () {
        var fs = sl.requestFullscreen || sl.webkitRequestFullscreen;
        if (fs) {
          try {
            var p = fs.call(sl, { navigationUI: "hide" });
            if (p && p.catch) p.catch(function () {});
          } catch (e) {}
        }
        try {
          if (screen.orientation && screen.orientation.lock) {
            var lp = screen.orientation.lock("landscape");
            if (lp && lp.catch) lp.catch(function () {});
          }
        } catch (e) {}
        hideGate();
      });

      document.getElementById("g-skip").addEventListener("click", hideGate);

      // Tocar la pantalla = avanzar (solo en táctil).
      // El player vive en un iframe que consume los toques: la composición
      // reenvía tap/swipe vía postMessage y aquí los convertimos en navegación,
      // pulsando los botones internos del componente (vía probada).
      function pressNext() {
        var b = document.querySelector('[data-hf-next]');
        if (b) { b.click(); return true; }
        try { sl.next(); } catch (e) {}
      }
      function pressPrev() {
        var b = document.querySelector('[data-hf-prev]');
        if (b) { b.click(); return true; }
        try { sl.prev(); } catch (e) {}
      }
      var taps = 0;
      window.addEventListener("message", function (e) {
        var d = e.data;
        if (!d || d.type !== "hf-gesture") return;
        if (gateUp) return; // puerta abierta → ignorar gestos
        if (d.action === "next") {
          pressNext();
          taps++;
          if (taps >= 4) tapHint.classList.remove("show");
        } else if (d.action === "prev") {
          pressPrev();
        }
      });

      window.addEventListener("resize", function () {
        // Refit del escenario
        fit();
        refreshGate();
      });

      // ══ Fit 1920x1080 con visualViewport (barra de Safari) ══
      window.__fitStage = function () {
        var w = window.innerWidth, h = window.innerHeight;
        if (window.visualViewport) {
          w = Math.max(w, window.visualViewport.width);
          h = Math.max(h, window.visualViewport.height);
        }
        var s = Math.min(w / 1920, h / 1080);
        stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
      };
      function fit() { window.__fitStage(); }
      window.addEventListener("orientationchange", function () { setTimeout(fit, 250); });
      if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
      fit();

      showGate();

      // Mantener foco para teclado (escritorio)
      window.addEventListener("pointerdown", function () { if (sl) sl.focus(); });
      applyLang(userLang);
      // La composición puede tardar en cargar: reenviar el idioma cuando esté lista.
      setTimeout(function () { pushLangToDeck(userLang); }, 800);
      setTimeout(function () { pushLangToDeck(userLang); }, 2500);
    })();
  </script>
</body>
</html>
